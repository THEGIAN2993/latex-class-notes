    <script>
    // Your 7 PDFs
    const problemSets = [
        { label: "Problem Set 1", path: "Fall 2025/548 Transition to Grad Math/Portfolio Assignment 1/main.pdf" },
        { label: "Problem Set 2", path: "Fall 2025/548 Transition to Grad Math/Portfolio Assignment 2/main.pdf" },
        { label: "Problem Set 3", path: "Fall 2025/548 Transition to Grad Math/Portfolio Assignment 3/main.pdf" },
        { label: "Problem Set 4", path: "Fall 2025/548 Transition to Grad Math/Portfolio Assignment 4/main.pdf" },
        { label: "Problem Set 6", path: "Fall 2025/548 Transition to Grad Math/Portfolio Assignment 6/main.pdf" },
        { label: "Problem Set 7", path: "Fall 2025/548 Transition to Grad Math/Portfolio Assignment 7/main.pdf" },
        { label: "Problem Set 8", path: "Fall 2025/548 Transition to Grad Math/Portfolio Assignment 8/main.pdf" },
    ];

    // simple styling (optional)
    const style = document.createElement("style");
    style.textContent = `
        #tgmps-menu { margin:.5rem 0 0 0; padding:0; list-style:none; display:none; }
        #tgmps-menu li { margin: .25rem 0; }
        #tgmps-menu a { text-decoration: none; }
        #tgmps-menu a:hover, #tgmps-menu a:focus { text-decoration: underline; }
        #tgmps-link { cursor: pointer; }
    `;
    document.head.appendChild(style);

    const link = document.getElementById("tgmps-link");

    // build the inline menu once
    const menu = document.createElement("ul");
    menu.id = "tgmps-menu";
    problemSets.forEach(ps => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = ps.label;
        a.href = ps.path;
        a.target = "_blank";
        a.rel = "noopener";
        li.appendChild(a);
        menu.appendChild(li);
    });

    // insert menu right after the link
    link.insertAdjacentElement("afterend", menu);

    // toggle visibility on click/Enter/Space
    function toggleMenu(e) {
        e.preventDefault();
        menu.style.display = (menu.style.display === "none" || !menu.style.display) ? "block" : "none";
    }

    link.setAttribute("role", "button");
    link.setAttribute("aria-expanded", "false");
    link.addEventListener("click", (e) => {
        toggleMenu(e);
        link.setAttribute("aria-expanded", menu.style.display === "block" ? "true" : "false");
    });
    link.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
        toggleMenu(e);
        link.setAttribute("aria-expanded", menu.style.display === "block" ? "true" : "false");
        }
    });
    </script>


</ul>
